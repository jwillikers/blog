name: Bundler Update

"on":
  schedule:
    # Once a month on the 22nd
    - cron: "0 0 22 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bundler-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Update Gem lock file
        run: nix develop --command bundle update
      - name: Update the hashes in the gemset.nix file
        run: nix develop --command bundix
      - name: Format the gemset.nix file
        run: nix fmt
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          assignees: ${{ github.repository_owner }}
          branch: "update/bundler"
          commit-message: "chore(deps): Update Gem lock file"
          title: "chore(deps): Update Gem lock file"
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        # Use the PAT so that the merge triggers the push workflows on main.
        run: gh pr merge --auto --merge "${{ steps.cpr.outputs.pull-request-number }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_UPDATES }}
