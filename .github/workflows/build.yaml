name: Build Jekyll site

"on":
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Always run this job so that required status checks report on every PR,
      # but only do the work when relevant files changed.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            relevant:
              - "**.nix"
              - .github/workflows/build.yaml
              - flake.lock
              - Gemfile
              - Gemfile.lock
              - .bundle/config
              - .ruby-version
              - _data/**
              - _drafts/**
              - _includes/**
              - _pages/**
              - _posts/**
              - _config.yml
              - index.adoc
      - name: Determine whether to run
        id: gate
        run: echo "run=${{ github.event_name != 'pull_request' || steps.filter.outputs.relevant == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'
      - uses: DeterminateSystems/nix-installer-action@v23
        if: steps.gate.outputs.run == 'true'
      # todo Cache bundler stuff?
      - name: Build with Jekyll
        if: steps.gate.outputs.run == 'true'
        run: nix build
